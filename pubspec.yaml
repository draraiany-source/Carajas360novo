name: servico_conecta
description: "ServicoConecta - O maior marketplace de servicos do Brasil"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_storage: ^13.4.5
  firebase_messaging: ^16.4.3
  firebase_analytics: ^12.4.5
  firebase_crashlytics: ^5.2.6
  cloud_functions: ^6.0.0
  google_maps_flutter: ^2.6.0
  geolocator: ^14.0.3
  google_fonts: ^8.2.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  http: ^1.2.1
  qr_flutter: ^4.1.0
  flutter_local_notifications: ^22.1.0
  image_picker: ^1.1.2
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  file_picker: ^12.0.0-beta.7
  record: ^7.1.1
  audioplayers: ^6.1.0
  pdf: ^3.11.1
  share_plus: ^13.2.1
  path_provider: ^2.1.4
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.2
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
  assets:
    - assets/logos/
    - assets/icons/png/
    - assets/icons/svg/
    - assets/illustrations/
    - assets/onboarding/
    - assets/splash/
    - assets/splash/png/
    - assets/banners/
    - assets/categories/
    - assets/categories/outline/
    - assets/avatars/
    - assets/lottie/
    - assets/animations/
    - assets/backgrounds/
    - assets/mascot/
    - assets/sounds/
    - assets/markers/
    - assets/marketplace/
    - assets/wallet/
    - assets/chat/
    - assets/gps/
    - assets/empty_states/
    - assets/tia_carajas/
